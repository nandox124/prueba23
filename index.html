<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invitación 15 Años</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    /* Pantalla de inicio */
    .intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-image: url('assets/fondo_inicial.png');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }

    .intro-screen img {
      width: 50%; /* Ajusta al 50% del ancho de la pantalla */
      max-width: 500px; /* Máximo tamaño de la imagen */
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }

    /* Nuevo texto 'Toca para abrir' */
    .intro-text {
      font-size: 1.5rem;
      color: white;
      font-weight: bold;
      margin-top: 20px;
      animation: pulse 1.5s infinite;
    }

    .intro-screen .cursor {
      width: 60px;
      margin-top: 20px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .hidden {
      display: none !important;
    }

    /* Video portada */
    .hero {
      width: 100%;
      height: 0;
      padding-top: 177.77%;
      position: relative;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      will-change: transform;
    }

    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
    }

    .section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
      padding: 0 10px;
    }

    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 20px;
      padding: 20px;
      width: 100%;
    }

    .parallax-img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      transition: transform 0.6s ease-out, opacity 1s ease-out;
      will-change: transform, opacity;
      opacity: 0;
      transform: translateY(30px);
      display: block;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      border: none;
    }

    .parallax-img.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .countdown {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      z-index: 3;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
    }

    .countdown-item span {
      font-size: 2em;
      font-weight: bold;
      color: red;
    }

    .countdown-item div {
      font-size: 1.2em;
      color: white;
      margin-top: 5px;
    }

    .countdown-item:not(:last-child) {
      border-right: 3px solid red;
      padding-right: 10px;
    }

    .countdown-item:first-child {
      border-left: 3px solid red;
      padding-left: 10px;
    }

    .countdown-item:last-child {
      border-right: 3px solid red;
      padding-right: 10px;
    }

    .map-button, .whatsapp-button {
      padding: 20px 35px;
      background-color: #ce0707;
      color: white;
      font-size: 3vw;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      animation: pulse 1.5s infinite;
    }

    .map-button:hover, .whatsapp-button:hover {
      background-color: #ce0707;
    }

    /* Estilo para el botón flotante de música */
    .music-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: transparent; /* Hacemos el fondo transparente */
      border: none;
      width: 60px;
      height: 60px;
      display: none; /* Inicialmente invisible */
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      animation: pulse 1.5s infinite;
      z-index: 200; /* Asegura que el botón esté por encima de todo */
    }

    .music-button img {
      width: 100%; /* Ajusta el tamaño de la imagen al tamaño del botón */
      height: 100%; /* Asegura que la imagen ocupe todo el espacio del botón */
      object-fit: contain; /* Asegura que la imagen no se deforme */
    }

    @media (max-width: 768px) {
      .parallax-img {
        width: 100%;
        height: auto;
      }

      .hero video {
        width: 100%;
        height: auto;
      }

      .map-button, .whatsapp-button {
        font-size: 5vw;
      }

      /* Reducir el tamaño del contador en pantallas medianas */
      .countdown-item span {
        font-size: 1.5em;
      }
    }

    @media (max-width: 480px) {
      .map-button, .whatsapp-button {
        padding: 15px 25px;
      }

      /* Reducir aún más el tamaño del contador en pantallas más pequeñas */
      .countdown-item span {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>

  <!-- Intro con sobre -->
  <div id="introScreen" class="intro-screen">
    <img src="assets/sobre.png" alt="Abrir invitación" id="openEnvelope">
    <div id="openText" class="intro-text">Toca para abrir</div>
    <img src="assets/cursor.png" alt="Toca aquí" class="cursor">
  </div>

  <!-- Contenido principal -->
  <div id="mainContent" class="hidden">
    <!-- Video portada -->
    <div class="hero">
      <video muted playsinline loop id="heroVideo">
        <source src="assets/portada.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Fondo decorativo -->
    <div class="video-background">
      <video muted playsinline loop id="backgroundVideo">
        <source src="assets/fondo.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Secciones -->
    <div class="section">
      <img src="assets/imagen1.png" alt="Nombre y frase" class="parallax-img">
      <div id="countdown" class="countdown">
        <div class="countdown-item"><span id="days"></span><div>días</div></div>
        <div class="countdown-item"><span id="hours"></span><div>horas</div></div>
        <div class="countdown-item"><span id="minutes"></span><div>minutos</div></div>
        <div class="countdown-item"><span id="seconds"></span><div>segundos</div></div>
      </div>
    </div>

    <div class="section">
      <div class="content-center">
        <img src="assets/imagen2.png" alt="Papás" class="parallax-img">
        <a href="https://www.google.com/maps" target="_blank" class="map-button">Ver en Google Maps</a>
      </div>
    </div>

    <div class="section">
      <img src="assets/imagen3.png" alt="Fiesta y padrinos" class="parallax-img">
    </div>

    <div class="section">
      <div class="content-center">
        <img src="assets/imagen4.png" alt="Cronograma" class="parallax-img">
        <!-- Botón de WhatsApp alineado correctamente en la imagen 4 -->
        <a href="https://wa.me/1234567890" target="_blank" class="whatsapp-button">Confirmar por WhatsApp</a>
      </div>
    </div>

    <div class="section">
      <div class="content-center">
        <img src="assets/imagen5.png" alt="Despedida" class="parallax-img">
      </div>
    </div>
  </div>

  <!-- Audio -->
  <audio id="backgroundMusic" loop>
    <source src="assets/musica.mp3" type="audio/mp3">
  </audio>

  <!-- Botón flotante de música -->
  <div id="musicButton" class="music-button" onclick="toggleMusic()">
    <img id="musicIcon" src="assets/music-icon.png" alt="Música" />
  </div>

  <!-- Scripts -->
  <script>
    // Variables
    const openEnvelope = document.getElementById('openEnvelope');
    const introScreen = document.getElementById('introScreen');
    const mainContent = document.getElementById('mainContent');
    const heroVideo = document.getElementById('heroVideo');
    const backgroundVideo = document.getElementById('backgroundVideo');
    const music = document.getElementById('backgroundMusic');
    const musicButton = document.getElementById('musicButton');
    const musicIcon = document.getElementById('musicIcon');

    openEnvelope.addEventListener('click', () => {
      introScreen.classList.add('hidden');
      mainContent.classList.remove('hidden');

      music.play();
      heroVideo.play();
      backgroundVideo.play();

      // Mostrar el botón flotante de música
      musicButton.style.display = 'flex';
    });

    // Función para alternar entre pausar y reproducir la música
    function toggleMusic() {
      if (music.paused) {
        music.play();
        musicIcon.src = 'assets/music-icon-playing.png'; // Cambia el ícono cuando la música está reproduciendo
      } else {
        music.pause();
        musicIcon.src = 'assets/music-icon.png'; // Cambia el ícono cuando la música está pausada
      }
    }

    // Parallax
    const parallaxImages = document.querySelectorAll('.parallax-img');
    const videoBackground = document.querySelector('.video-background');

    window.addEventListener('scroll', () => {
      const scrollTop = window.pageYOffset;

      parallaxImages.forEach(img => {
        const offsetTop = img.parentElement.offsetTop;
        const distance = (scrollTop - offsetTop + window.innerHeight) * 0.1;
        img.style.transform = `translateY(${distance}px)`;
      });

      videoBackground.style.transform = `translateY(${scrollTop * 0.3}px)`;
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        } else {
          entry.target.classList.remove('visible');
        }
      });
    }, {
      threshold: 0.3
    });

    parallaxImages.forEach(img => observer.observe(img));

    // Contador
    function startCountdown() {
      const daysElement = document.getElementById('days');
      const hoursElement = document.getElementById('hours');
      const minutesElement = document.getElementById('minutes');
      const secondsElement = document.getElementById('seconds');
      const targetDate = new Date('2025-05-15T00:00:00');

      function updateCountdown() {
        const now = new Date();
        const remaining = targetDate - now;

        if (remaining <= 0) {
          daysElement.textContent = '0';
          hoursElement.textContent = '0';
          minutesElement.textContent = '0';
          secondsElement.textContent = '0';
          return;
        }

        const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
        const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

        daysElement.textContent = days;
        hoursElement.textContent = hours;
        minutesElement.textContent = minutes;
        secondsElement.textContent = seconds;
      }

      setInterval(updateCountdown, 1000);
      updateCountdown();
    }

    startCountdown();

    // Bloquear el clic derecho
    document.addEventListener('contextmenu', function(event) {
      event.preventDefault();
    });

  </script>

</body>
</html>
